<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Caméra frontale – suivi des yeux</title>
<style>
  :root { --bg:#0b0b0c; --fg:#f5f5f5; --muted:#9a9aa0; --accent:#ffd60a; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  .app { display:flex; flex-direction:column; height:100%;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  .top { display:flex; justify-content:space-between; align-items:center; padding:12px 16px; gap:8px; }
  .chip { background:#1c1c1f; color:var(--fg); border:0; border-radius:999px; padding:8px 14px;
    font-size:14px; font-weight:600; cursor:pointer; }
  .chip.on { background:var(--accent); color:#000; }
  .stage { position:relative; flex:1; margin:0 12px; border-radius:22px; overflow:hidden; background:#000;
    display:flex; align-items:center; justify-content:center; }
  video, .stage img { width:100%; height:100%; object-fit:cover; }
  .mirror { transform:scaleX(-1); }
  .placeholder { text-align:center; color:var(--muted); padding:24px; line-height:1.5; }
  .placeholder b { color:var(--fg); display:block; font-size:18px; margin-bottom:6px; }
  .count { position:absolute; inset:0; display:none; align-items:center; justify-content:center;
    font-size:120px; font-weight:800; text-shadow:0 4px 30px rgba(0,0,0,.6); }
  .flash { position:fixed; inset:0; background:#fff; opacity:0; pointer-events:none; transition:opacity .35s; z-index:10; }
  .filters { display:flex; gap:8px; overflow-x:auto; padding:12px 16px 4px; scrollbar-width:none; }
  .filters::-webkit-scrollbar { display:none; }
  .bottom { display:flex; align-items:center; justify-content:space-between; padding:14px 28px 20px; }
  .thumb { width:52px; height:52px; border-radius:12px; background:#1c1c1f center/cover no-repeat;
    border:2px solid #2a2a2e; cursor:pointer; }
  .shutter { width:78px; height:78px; border-radius:50%; border:5px solid #fff; background:transparent;
    padding:5px; cursor:pointer; }
  .shutter span { display:block; width:100%; height:100%; border-radius:50%; background:#fff; transition:transform .1s; }
  .shutter:active span { transform:scale(.88); }
  .side { width:52px; height:52px; border-radius:50%; background:#1c1c1f; border:0; color:var(--fg);
    font-size:22px; cursor:pointer; }
  /* Galerie */
  .sheet { position:fixed; inset:0; background:rgba(0,0,0,.92); display:none; flex-direction:column; z-index:20;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  .sheet.open { display:flex; }
  .sheet header { display:flex; justify-content:space-between; align-items:center; padding:14px 16px; }
  .viewer { flex:1; display:flex; align-items:center; justify-content:center; padding:0 12px; min-height:0; }
  .viewer img { max-width:100%; max-height:100%; border-radius:16px; }
  .strip { display:flex; gap:8px; overflow-x:auto; padding:12px 16px; }
  .strip img { width:56px; height:56px; object-fit:cover; border-radius:10px; opacity:.55; cursor:pointer; flex:none; }
  .strip img.sel { opacity:1; outline:2px solid var(--accent); }
  .actions { display:flex; gap:10px; justify-content:center; padding:4px 16px 16px; flex-wrap:wrap; }
  .msg { text-align:center; color:var(--muted); font-size:13px; min-height:18px; padding:0 16px 8px; }
  input[type=file] { display:none; }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <button class="chip" id="btnMirror">Miroir</button>
    <button class="chip" id="btnTimer">⏱ Off</button>
    <button class="chip" id="btnLight">💡 Flash</button>
    <button class="chip on" id="btnEyes">🔴 Yeux</button>
  </div>

  <div class="stage" id="stage">
    <video id="video" class="mirror" autoplay playsinline muted style="display:none"></video>
    <div class="placeholder" id="placeholder"><b>Caméra frontale</b>Démarrage de la caméra…</div>
    <canvas id="overlay" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none"></canvas>
    <div id="status" style="position:absolute;left:0;right:0;bottom:10px;text-align:center;font-size:13px;color:#ddd;text-shadow:0 1px 4px #000"></div>
    <div class="count" id="count"></div>
  </div>

  <div class="filters" id="filters"></div>

  <div class="bottom">
    <div class="thumb" id="thumb" title="Galerie"></div>
    <button class="shutter" id="shutter" aria-label="Prendre une photo"><span></span></button>
    <button class="side" id="btnFlip" aria-label="Changer de caméra">⟲</button>
  </div>
</div>

<div class="flash" id="flash"></div>
<input type="file" id="nativeCam" accept="image/*" capture="user">
<canvas id="canvas" style="display:none"></canvas>

<div class="sheet" id="sheet">
  <header>
    <button class="chip" id="closeSheet">✕ Fermer</button>
    <span id="sheetCount" style="color:var(--muted);font-size:14px"></span>
  </header>
  <div class="viewer"><img id="bigImg" alt=""></div>
  <div class="strip" id="strip"></div>
  <div class="actions">
    <button class="chip on" id="btnSave">⬇ Enregistrer</button>
    <button class="chip" id="btnDelete">🗑 Supprimer</button>
  </div>
  <div class="msg" id="msg"></div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const video = $('video'), canvas = $('canvas'), stage = $('stage');
  const FILTERS = [
    ['Normal','none'], ['N&B','grayscale(1)'], ['Sépia','sepia(.8)'],
    ['Chaud','saturate(1.3) sepia(.25) brightness(1.05)'], ['Froid','saturate(.9) hue-rotate(15deg) brightness(1.05)'],
    ['Vif','saturate(1.7) contrast(1.1)'], ['Doux','brightness(1.12) contrast(.9) saturate(.9)'],
    ['Noir','grayscale(1) contrast(1.5)']
  ];
  let filter = 'none', mirror = true, timer = 0, screenLight = false;
  let facing = 'user', stream = null, live = false;
  const photos = []; let current = -1;

  // ---- Filtres
  FILTERS.forEach(([name, css], i) => {
    const b = document.createElement('button');
    b.className = 'chip' + (i === 0 ? ' on' : '');
    b.textContent = name;
    b.onclick = () => {
      filter = css; video.style.filter = css;
      document.querySelectorAll('#filters .chip').forEach(c => c.classList.remove('on'));
      b.classList.add('on');
    };
    $('filters').appendChild(b);
  });

  // ---- Réglages
  $('btnMirror').classList.add('on');
  $('btnMirror').onclick = e => {
    mirror = !mirror; e.currentTarget.classList.toggle('on', mirror);
    video.classList.toggle('mirror', mirror);
  };
  $('btnTimer').onclick = e => {
    timer = timer === 0 ? 3 : timer === 3 ? 10 : 0;
    e.currentTarget.textContent = timer ? `⏱ ${timer}s` : '⏱ Off';
    e.currentTarget.classList.toggle('on', !!timer);
  };
  $('btnLight').onclick = e => { screenLight = !screenLight; e.currentTarget.classList.toggle('on', screenLight); };

  // ---- Caméra en direct (si le navigateur l'autorise)
  async function startCamera() {
    if (stream) stream.getTracks().forEach(t => t.stop());
    try {
      if (!navigator.mediaDevices?.getUserMedia) throw new Error('no-gum');
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: facing, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false
      });
      video.srcObject = stream;
      await video.play();
      video.style.display = 'block';
      $('placeholder').style.display = 'none';
      live = true;
    } catch (err) {
      live = false;
      video.style.display = 'none';
      $('placeholder').style.display = 'block';
      $('placeholder').innerHTML = '<b>Caméra frontale</b>L’aperçu en direct n’est pas disponible ici.<br>' +
        'Appuie sur le bouton blanc : la caméra selfie de ton téléphone s’ouvre, puis la photo revient ici avec le filtre choisi.';
    }
  }

  $('btnFlip').onclick = () => {
    facing = facing === 'user' ? 'environment' : 'user';
    mirror = facing === 'user';
    $('btnMirror').classList.toggle('on', mirror);
    video.classList.toggle('mirror', mirror);
    $('nativeCam').setAttribute('capture', facing);
    if (live) startCamera();
  };

  // ---- Prise de photo
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  let busy = false;
  $('shutter').onclick = async () => {
    if (!live) { $('nativeCam').click(); return; }
    if (busy) return; busy = true;
    for (let s = timer; s > 0; s--) {
      $('count').style.display = 'flex'; $('count').textContent = s; await sleep(1000);
    }
    $('count').style.display = 'none';
    const fl = $('flash');
    if (screenLight) { fl.style.transition = 'none'; fl.style.opacity = '1'; await sleep(250); }
    capture(video, video.videoWidth, video.videoHeight, mirror);
    fl.style.transition = 'opacity .35s'; fl.style.opacity = screenLight ? '0' : '.85';
    if (!screenLight) setTimeout(() => fl.style.opacity = '0', 60);
    busy = false;
  };

  $('nativeCam').onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    const img = new Image();
    img.onload = () => { capture(img, img.naturalWidth, img.naturalHeight, mirror && facing === 'user'); URL.revokeObjectURL(img.src); };
    img.src = URL.createObjectURL(f);
    e.target.value = '';
  };

  function capture(src, w, h, flip) {
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext('2d');
    ctx.save();
    ctx.filter = filter;
    if (flip) { ctx.translate(w, 0); ctx.scale(-1, 1); }
    ctx.drawImage(src, 0, 0, w, h);
    ctx.restore();
    const e = src === video && window.__eyes && window.__eyes();
    if (e && window.__drawDot) {
      const P = e.map(p => [flip ? w - p.x*w : p.x*w, p.y*h]);
      const r = Math.max(6, Math.hypot(P[0][0]-P[1][0], P[0][1]-P[1][1]) * 0.09);
      P.forEach(([x, y]) => window.__drawDot(ctx, x, y, r));
    }
    canvas.toBlob(blob => {
      const url = URL.createObjectURL(blob);
      photos.push({ blob, url });
      $('thumb').style.backgroundImage = `url(${url})`;
      if (!live) openSheet(photos.length - 1);
    }, 'image/jpeg', 0.92);
  }

  // ---- Galerie
  function renderStrip() {
    $('strip').innerHTML = '';
    photos.forEach((p, i) => {
      const im = document.createElement('img');
      im.src = p.url; im.className = i === current ? 'sel' : '';
      im.onclick = () => openSheet(i);
      $('strip').appendChild(im);
    });
    $('sheetCount').textContent = photos.length ? `${current + 1} / ${photos.length}` : '';
  }
  function openSheet(i) {
    if (!photos.length) return;
    current = i; $('bigImg').src = photos[i].url; $('msg').textContent = '';
    renderStrip(); $('sheet').classList.add('open');
  }
  $('thumb').onclick = () => openSheet(photos.length - 1);
  $('closeSheet').onclick = () => $('sheet').classList.remove('open');
  $('btnDelete').onclick = () => {
    URL.revokeObjectURL(photos[current].url);
    photos.splice(current, 1);
    const last = photos[photos.length - 1];
    $('thumb').style.backgroundImage = last ? `url(${last.url})` : '';
    if (!photos.length) { $('sheet').classList.remove('open'); return; }
    openSheet(Math.min(current, photos.length - 1));
  };

  // ---- Enregistrement
  let downloads = null;
  if (window.claude?.use) claude.use('downloads').then(d => downloads = d).catch(() => {});
  const stamp = () => new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
  $('btnSave').onclick = async () => {
    const p = photos[current]; if (!p) return;
    const filename = `selfie-${stamp()}.jpg`;
    if (downloads) {
      try { await downloads.save({ filename, data: p.blob }); $('msg').textContent = 'Photo enregistrée.'; }
      catch { $('msg').textContent = 'Enregistrement annulé. Astuce : appui long sur la photo → « Enregistrer l’image ».'; }
      return;
    }
    try {
      const a = document.createElement('a'); a.href = p.url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      $('msg').textContent = 'Téléchargement lancé.';
    } catch { $('msg').textContent = 'Appui long sur la photo → « Enregistrer l’image ».'; }
  };

  startCamera();
})();
</script>
<script type="module">
import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";
const video = document.getElementById('video'), ov = document.getElementById('overlay');
const status = document.getElementById('status'), btn = document.getElementById('btnEyes');
const ctx = ov.getContext('2d');
let on = true, lm = null, lastT = -1, eyes = null;
btn.onclick = () => { on = !on; btn.classList.toggle('on', on); if (!on) ctx.clearRect(0,0,ov.width,ov.height); };
window.__eyes = () => (on ? eyes : null); // utilisé pour dessiner les points dans la photo

try {
  status.textContent = 'Chargement du suivi des yeux…';
  const fs = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  lm = await FaceLandmarker.createFromOptions(fs, {
    baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task", delegate: "GPU" },
    runningMode: "VIDEO", numFaces: 1
  });
  status.textContent = '';
} catch (e) { status.textContent = 'Suivi des yeux indisponible (modèle non chargé).'; }

function loop() {
  requestAnimationFrame(loop);
  if (!lm || !on || video.readyState < 2 || video.style.display === 'none') return;
  if (video.currentTime === lastT) return; lastT = video.currentTime;
  const r = lm.detectForVideo(video, performance.now());
  const dpr = window.devicePixelRatio || 1, cw = ov.clientWidth, ch = ov.clientHeight;
  if (ov.width !== cw*dpr) { ov.width = cw*dpr; ov.height = ch*dpr; }
  ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,cw,ch);
  const f = r.faceLandmarks?.[0];
  if (!f) { eyes = null; status.textContent = on ? 'Aucun visage détecté' : ''; return; }
  status.textContent = '';
  const vw = video.videoWidth, vh = video.videoHeight;
  const sc = Math.max(cw/vw, ch/vh), ox = (cw - vw*sc)/2, oy = (ch - vh*sc)/2;
  const mir = video.classList.contains('mirror');
  const pts = [f[468], f[473]]; // centres des iris
  eyes = pts.map(p => ({ x: p.x, y: p.y }));
  const toScreen = p => { let x = p.x*vw*sc + ox; if (mir) x = cw - x; return [x, p.y*vh*sc + oy]; };
  const [a, b] = pts.map(toScreen);
  const rad = Math.max(4, Math.hypot(a[0]-b[0], a[1]-b[1]) * 0.09);
  for (const [x, y] of [a, b]) dot(ctx, x, y, rad);
}
function dot(c, x, y, r) {
  c.beginPath(); c.arc(x, y, r, 0, Math.PI*2);
  c.fillStyle = '#ff2d2d'; c.shadowColor = 'rgba(255,0,0,.8)'; c.shadowBlur = r;
  c.fill(); c.shadowBlur = 0; c.lineWidth = Math.max(1, r*0.25); c.strokeStyle = '#fff'; c.stroke();
}
window.__drawDot = dot;
loop();
</script>
</body>
</html>
